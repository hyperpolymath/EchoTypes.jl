# SPDX-License-Identifier: MPL-2.0
# Runs the Julia test suite (test/runtests.jl). Before this workflow, no CI
# job ran the package's own tests: the other workflows are governance,
# labels, notifications and secret scanning.
name: "Julia package tests"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: julia-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The lowest version that [compat] allows, and a current release.
        julia: ["1.10", "1.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - name: Run the test suite
        run: julia --project=. -e 'using Pkg; Pkg.test()'
